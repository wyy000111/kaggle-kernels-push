name: Rerun Kaggle kernel (weekdays 09:00 CST)

# GitHub Actions cron uses UTC. 01:00 UTC = 09:00 Asia/Shanghai (UTC+8).
on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only pull and validate the notebook; do not push/run'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kaggle-kernel-rerun
  cancel-in-progress: false

jobs:
  rerun:
    name: Push and run kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KERNEL_SLUG: yongyongwuvip/gemma-4-26b-a4b-it-qat-ud-q4-k-xl-dat
      MODEL_FILE: gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_ACCELERATOR: NvidiaTeslaT4
      KAGGLE_TIMEOUT: '3600'
      STATUS_POLL_SECONDS: '180'
      STATUS_INTERVAL_SECONDS: '15'
      OUTPUT_FILE_PATTERN: ollama_base_url.txt
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      ARTIFACT_DIR: artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          kaggle --version

      - name: Configure Kaggle credentials
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kaggle"
          if [ -n "${KAGGLE_API_TOKEN:-}" ]; then
            printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
            chmod 600 "$HOME/.kaggle/access_token"
            echo "Using KAGGLE_API_TOKEN from secrets."
          else
            if [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; then
              echo "Missing secrets: set KAGGLE_USERNAME + KAGGLE_KEY, or KAGGLE_API_TOKEN." >&2
              exit 1
            fi
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
            echo "Using KAGGLE_USERNAME/KAGGLE_KEY from secrets."
          fi

      - name: Verify credentials
        run: kaggle kernels list --mine --page-size 1 > /dev/null && echo "Kaggle auth OK."

      - name: Pull, push and monitor kernel
        run: bash scripts/rerun_kaggle_kernel.sh

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kaggle-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
